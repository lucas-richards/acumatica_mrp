{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login">
  <section class="card">
    <h1>Purchasing Planner</h1>
    <p class="subtitle">Sign in with your MRP planner account.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% if form.non_field_errors %}<p class="field-error" role="alert">Your username and password didn't match. Please try again.</p>{% endif %}
      <div class="field">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" autocomplete="username" autofocus required value="{{ form.username.value|default:'' }}">
      </div>
      <div class="field">
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-block">Sign in</button>
    </form>
  </section>
</div>
{% endblock %}
