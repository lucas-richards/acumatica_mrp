# --- MRP purchasing planner (westridgeApp_mrp) mounted at /mrp -------------------
#
# Paste this block INSIDE the existing <VirtualHost *:80> in
# /etc/apache2/sites-enabled/000-default.conf, ABOVE the existing line
#     WSGIDaemonProcess westridgeApp ...
# mod_wsgi matches WSGIScriptAlias directives in the order they appear, so
# /mrp must come before westridgeApp's catch-all "WSGIScriptAlias /".
# Nothing in the westridgeApp lines needs to change.
#
# The app reads its secrets from /home/bc/westridgeApp_mrp/.env, so no
# SetEnv/PassEnv lines are needed (and none should contain real secrets).

    Alias /mrp/static /home/bc/westridgeApp_mrp/staticfiles
    <Directory /home/bc/westridgeApp_mrp/staticfiles>
        Require all granted
    </Directory>

    <Directory /home/bc/westridgeApp_mrp/config>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # Own daemon process, own venv. Runs as bc so the 600-mode .env is readable.
    WSGIDaemonProcess mrpApp user=bc group=bc processes=1 threads=5 display-name=%{GROUP} \
        python-home=/home/bc/westridgeApp_mrp/.venv python-path=/home/bc/westridgeApp_mrp
    WSGIScriptAlias /mrp /home/bc/westridgeApp_mrp/config/wsgi.py \
        process-group=mrpApp application-group=%{GLOBAL}

# --- end MRP block ----------------------------------------------------------------
